<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Mobile viewport: without this, mobile browsers render at a ~980px
       virtual width (zoomed-out desktop view), which shrinks the bottom
       nav off-screen and trips the desktop layout breakpoint. device-width
       makes Flutter see the real phone width so the mobile layout + floating
       nav render correctly. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Pennsylvania Mental Health Advance Directive - Create, manage, and export your mental health treatment preferences under PA Act 194.">

  <!--
    Link previews (Open Graph / Twitter cards): shared links show a title,
    description and image instead of a bare URL. Scrapers need ABSOLUTE URLs,
    so these point at the GitHub Pages deploy. og-image.jpg is a 1200x630 crop
    of the Home hero photo (tool/art; regenerate with magick if it changes).
  -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PA MHAD">
  <meta property="og:title" content="PA Mental Health Advance Directive">
  <meta property="og:description" content="Plan how you want to be treated in a mental health crisis, in plain language. Free, anonymous, nothing is saved.">
  <meta property="og:url" content="https://onica5000.github.io/MHAD/">
  <meta property="og:image" content="https://onica5000.github.io/MHAD/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Two people walking together along a path through green hills at sunrise">
  <meta name="twitter:card" content="summary_large_image">

  <!--
    PWA install metadata (Chrome/Edge — the design pivot 2026-06-04
    locked the web target to Chrome/Edge browsers, so iOS Safari /
    `apple-mobile-web-app-*` tags were dropped). The W3C
    `mobile-web-app-capable` covers Android Chrome's "add to home
    screen" PWA install. Theme color and orientation live in
    manifest.json (theme_color = navy primary, orientation = any).
  -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1E3A8A">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PA Mental Health Advance Directive</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Belt-and-suspenders service-worker cleanup. Flutter 3.41.4 already ships
    a self-unregistering SW stub (`flutter_service_worker.js`) — on activate
    it calls `registration.unregister()` and reloads every open tab onto the
    fresh build. This script adds a second cleanup pass that runs on every
    page load: it unregisters any SW still attached and clears the origin's
    Cache Storage. If Flutter ever changes the stub behavior in a future
    version, this snippet keeps the no-stale-SW guarantee.

    Runs early (before flutter_bootstrap.js) so cleanup is in flight while
    Flutter loads. Safe to ship: with no SW present this is a no-op.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      }).catch(function () { /* no SW or permission denied — ignore */ });
    }
    if ('caches' in window) {
      caches.keys().then(function (keys) {
        keys.forEach(function (k) { caches.delete(k); });
      }).catch(function () { /* ignore */ });
    }
  </script>
</head>
<body>
  <!--
    Loading splash: main.dart.js is multi-MB, so on a slow connection the
    user otherwise stares at a blank page until the first Flutter frame.
    Pure inline CSS (no external requests — CSP-safe), removed on the same
    flutter-first-frame event that hides the legal footer below.
  -->
  <style>
    /* Colors mirror the navy palette in lib/ui/theme/app_theme.dart
       (MhadPalette.navyLight / navyDark): scaffold background, primary and
       muted text. The splash should look like the app's first frame, not a
       separate beige page. */
    :root {
      --boot-bg: #F7F9FC;
      --boot-primary: #1E3A8A;
      --boot-on-primary: #FFFFFF;
      --boot-text: #111A2E;
      --boot-muted: #52607A;
      --boot-track: rgba(30, 58, 138, 0.18);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --boot-bg: #0A0F1B;
        --boot-primary: #8B9EE3;
        --boot-on-primary: #0A0F1B;
        --boot-text: #E5EAF5;
        --boot-muted: #BDC6DD;
        --boot-track: rgba(139, 158, 227, 0.25);
      }
    }
    #boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: var(--boot-bg);
      z-index: 9998;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    }
    #boot-splash .boot-mark {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--boot-primary);
      color: var(--boot-on-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font: italic 34px/1 Georgia, "Times New Roman", serif;
      box-shadow: 0 10px 30px rgba(30, 58, 138, 0.25);
    }
    #boot-splash .boot-title {
      color: var(--boot-text);
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      padding: 0 24px;
    }
    #boot-splash .boot-sub {
      color: var(--boot-muted);
      font-size: 14px;
    }
    #boot-splash .boot-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--boot-track);
      border-top-color: var(--boot-primary);
      border-radius: 50%;
      animation: boot-spin 0.9s linear infinite;
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #boot-splash .boot-spinner { animation: none; }
    }
  </style>
  <div id="boot-splash">
    <div class="boot-mark" aria-hidden="true">m</div>
    <div class="boot-title">PA Mental Health Advance Directive</div>
    <div class="boot-spinner" role="progressbar" aria-label="Loading"></div>
    <div class="boot-sub">Loading&hellip;</div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <!-- Accessible privacy/legal links before app loads (GDPR/CCPA compliance) -->
  <noscript>
    <p style="text-align:center;padding:20px;font-family:sans-serif;">
      This app requires JavaScript to run.
    </p>
  </noscript>
  <div id="legal-footer" style="position:fixed;bottom:0;width:100%;text-align:center;padding:8px;font-size:12px;font-family:system-ui,sans-serif;color:var(--boot-muted,#52607A);background:var(--boot-bg,#F7F9FC);border-top:1px solid rgba(30,58,138,0.12);z-index:9999;">
    Not a medical device. Not legal advice.
    &bull; <a href="#/privacy-policy" style="color:var(--boot-primary,#1E3A8A);">Privacy Policy</a>
    &bull; <a href="#/disclaimer" style="color:var(--boot-primary,#1E3A8A);">Legal Disclaimer</a>
    &bull; This app does not use cookies or tracking.
  </div>
  <script>
    // Hide the boot splash and legal footer once the Flutter app loads
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('boot-splash');
      if (splash) splash.remove();
      var footer = document.getElementById('legal-footer');
      if (footer) footer.style.display = 'none';
    });
  </script>
</body>
</html>
